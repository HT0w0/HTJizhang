# electron-builder 打包配置（第 7 阶段）
#
# 打包分两步：先把源码编译进 out/（npm run build），再由 electron-builder 把 out/
# 和 Electron 运行时一起装进安装包。`npm run build:win` 把这两步连起来做。
#
# 产物在 release/ 下。Windows 出 NSIS 安装程序（.exe），macOS 出 .dmg。
# macOS 那一份只能在苹果电脑或 GitHub 云端机器上打包，本地 Windows 造不出来（§四）。

appId: com.ht0w0.htjizhang

# exe 文件属性里显示的版权。署名与 LICENSE 保持一致。
# ⚠️ 这个键只能放在**最顶层**：electron-builder 26 的 schema 里 win 一节
# 不接受 copyright（写进 win 里会让整个打包配置校验失败，报的却是一句
# 「configuration.win should be one of these: null」—— 完全指不到这一行）。
copyright: Copyright © 2026 HT0w0

# ⚠️ 必须是纯 ASCII 的 HTJizhang（CLAUDE.md §5.7）。
# 这个值会渗进安装目录名、可执行文件名、开始菜单的文件夹名、注册表项 ——
# 中文名会让部分工具处理不了，而且实测出现过数据目录跟着漂移的坑（§5.16）。
# 用户看到的中文名「HT记账」在下面 nsis 一节单独指定。
productName: HTJizhang

directories:
  buildResources: build
  output: release

# 打进安装包的内容。
# 渲染进程的 React / Recharts 已经被 Vite 打包进 out/renderer 里了，
# 所以运行时**不需要 node_modules**（dependencies 里那三个包一个都不会被 require）。
files:
  - out/**
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  # 装到「当前用户」下，**不需要管理员密码**，也不弹 UAC 授权框。
  # 公司电脑、没有管理员权限的电脑上，装不上是最常见的失败原因，这一项直接绕开它。
  perMachine: false

  # 给用户一个「选择安装位置」的步骤；一路「下一步」也能装完。
  oneClick: false
  allowToChangeInstallationDirectory: true

  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式用中文名。程序内部名（HTJizhang）和用户看到的名字（HT记账）在这里分开。
  shortcutName: HT记账
  # 「应用和功能」（控制面板）里显示的名字。不设的话会显示成 HTJizhang。
  uninstallDisplayName: HT记账

  # ⚠️ 绝对不要改成 true。
  # 账本存在 %APPDATA%\HTJizhang\ 下 —— 那是**用户的全部记账数据**。
  # 改成 true 之后，卸载软件会把用户的账本一并删掉，而且不可恢复。
  deleteAppDataOnUninstall: false

  # 安装包文件名用 ASCII：下载链接里带中文容易出乱码。
  artifactName: HTJizhang-${version}-setup.${ext}

# ---------------------------------------------------------------------------
# macOS（第 8 阶段）
#
# 只能在苹果电脑或 GitHub 云端 macOS 机器上跑，本地 Windows 出不了 .dmg。
# 本机永远跑不到下面这一段 —— 改它的时候**没法在本机验证**，
# 只能靠 GitHub 云端跑一次看结果（见 .github/workflows/build-mac.yml）。
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      # universal = Intel 芯片和苹果 M 系列芯片合在一个包里。
      # 代价是包大一倍（两种 Electron 运行时都要装进去，约 200 MB），
      # 好处是下载页上只有一个文件，用户不用先搞清自己是什么芯片。
      # 对「下载它的任何一个人」来说，少一步选择比省 100 MB 重要（§一）。
      arch: [universal]

  # build/ 里只有 icon.png（1024）和 icon.ico，没有 .icns。
  # electron-builder 会自己把这张 PNG 转成苹果要的 .icns，不用额外准备。
  icon: build/icon.png

  # Finder 里「显示简介 → 种类」那一栏显示成「财务」。不设就是一串内部编号。
  category: public.app-category.finance

  # 文件名用 ASCII、并且一眼能看出是给 Mac 的：
  # Windows 那边叫 HTJizhang-1.0.0-setup.exe，这边叫 HTJizhang-1.0.0-mac.dmg。
  artifactName: HTJizhang-${version}-mac.${ext}

  # 不设 minimumSystemVersion：让它用 Electron 自带的那份。
  # 自己填一个数字的话，填低了老系统会装上却打不开，填高了能装的人白白变少。

dmg:
  # 双击挂载后，访达左边显示的那个卷标用中文名（§5.7：中文名只用在用户看得见的地方）。
  # 不设的话会显示成「HTJizhang 1.0.0」。
  title: HT记账

  # dmg 本身不签名。默认就是 false，这里写出来是为了让下一个人一眼看到它是有意为之。
  sign: false

  # 挂载后窗口里显示什么、图标摆在哪 —— 用 electron-builder 的默认布局：
  # 左边程序图标、右边「应用程序」文件夹，拖过去就装好了。不自定义。
