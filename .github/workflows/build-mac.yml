# 在 GitHub 的云端苹果电脑上打包 macOS 安装包（.dmg）。
#
# 为什么必须放云端：本机是 Windows，**造不出 macOS 安装包** —— 这一条是 §四
# 里就定下来的（当时给用户对比过三个方案，这是选定的那个）。
#
# ---------------------------------------------------------------------------
# 什么时候跑（用户 2026-10-04 拍板：「打标签自动 + 也能手动点」）
#
#   1. 推一个 v 开头的标签 → 自动跑。意思是「我要发新版本了」。
#   2. 在仓库网页的 Actions 页手动点一下 → 也能跑。想单独试一次打包时用。
#
#   平时不动。不会在每次改代码时都出一堆没人下载的包。
#
# 打出来的包只有测试全绿才会传上去（同一次拍板「要，测试不过就不出包」）——
# 下载页上的包必须是通过测试的那一版，不能出现「测试红着、包却照样发出去」。
# ---------------------------------------------------------------------------
#
# ⚠️ 这个文件**改动之后没法在本机验证**：本机没有苹果电脑，跑不了 macOS 打包。
#    改完只能推上去、在 Actions 页面看云端跑得对不对。所以每处都写了为什么。
#
# ⚠️ 它会往 Releases 上传文件，所以推送这个文件需要 GitHub 令牌带 `workflow` 权限
#    （CLAUDE.md §10.4 记着这件事）。权限不够时 GitHub 会直接拒绝推送，
#    而不是「推上去了但不生效」—— 这一点是好的。

name: 打包 macOS 安装包

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: '把打好的 .dmg 传到哪个版本（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'

# 默认权限是「只读」，那样上传附件会被拒。只有这里明确给了写权限才传得上去。
permissions:
  contents: write

env:
  # ---------------------------------------------------------------------------
  # 镜像指向：仓库里的 .npmrc 把 Electron 二进制指向了国内镜像
  # （本机从 GitHub 下载实测只有 18 KB/s，国内镜像 1.5 MB/s，差 80 倍）。
  # 但云端机器在美国，指向国内镜像反而绕了大半个地球 —— 这里要盖掉它。
  #
  # 为什么要设两组变量：`ELECTRON_*` 是 Electron 工具链自己认的；
  # `.npmrc` 里的键会被 npm 转成 `npm_config_<键名>` 环境变量，而后者优先级更高。
  # 只设一组盖不住 .npmrc，所以两组都写。理由在 .npmrc 末尾也记了一遍。
  # ---------------------------------------------------------------------------
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
  npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/

  # 没有买苹果的签名证书（为什么没买写在 §八 第 7 阶段）。
  # 这里明确关掉「自动去钥匙串里找证书」：找不到时它会打印一大段警告，
  # 看起来像出错，其实只是没有证书而已。关掉之后打包日志干净、意图明确。
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-mac:
    name: 测试 → 打包 → 上传
    # macos-latest 而不是钉死版本号（比如 macos-14）：
    # 钉死的好处是结果稳定，坏处是 GitHub 哪天把那个镜像下线了，这里会**悄悄地不再出包**。
    # 这个项目平时没人盯着，宁可跟着官方往前滚。
    runs-on: macos-latest

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          # 与 Electron 44 内置的 Node、以及 package.json 里的 @types/node 24.x 对齐。
          # 版本对不上时，类型检查会放行一些运行时不存在的写法（§四）。
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # ---------------------------------------------------------------------
      # 先过测试关。放在打包**之前**，是为了让「测试没过」直接掐掉这一步之后的所有步骤 ——
      # 出一版测试没过的安装包挂到下载页上，是比打包失败更糟的结果：
      # 打包失败你会看见，坏包发出去了没人会告诉你。
      # ---------------------------------------------------------------------
      - name: 类型检查
        run: npm run typecheck

      - name: 自动化测试
        run: npm test

      # ⚠️ npm run build:mac 里带着 `--publish never`，**不能去掉**。
      #    第一次跑这个工作流时就栽在这上面：electron-builder 一旦察觉自己在 CI 里，
      #    会自作主张去「发布」到 GitHub，然后因为拿不到令牌而报错、整个任务变红 ——
      #    而那时 .dmg 其实已经打好了，白等十分钟。
      #    我们的上传是下面单独用 gh 命令做的（见「传到 Releases」那一步）。
      - name: 打包 macOS 安装包
        run: npm run build:mac

      # ---------------------------------------------------------------------
      # 打包产物自检。
      #
      # 为什么要有这一步：打包「成功」和「打出了一个能用的包」是两件事。这一步查不出
      # 它在真 Mac 上装不装得上（**本机没有苹果电脑，这一点谁也没法在这里证明**），
      # 但能挡住最蠢的一种情况：命令返回 0、release/ 里其实什么都没有，然后
      # 上传那一步拿着一堆不存在的文件去传。
      # ---------------------------------------------------------------------
      - name: 检查打出来的文件
        run: |
          echo "=== release/ 里有什么 ==="
          ls -lh release/ || true

          # 用 nullglob + 数组来找 .dmg，而不用 `ls release/*.dmg`：
          # 通配符没匹配到任何文件时，`ls` 会报错，而它的退出码会被管道吃掉 ——
          # 那时「一个包都没打出来」这种情况反而不会让这一步失败。
          # 这正是本项目最怕的那类事：检查看起来在跑，其实什么都没看住（§九）。
          shopt -s nullglob
          dmgs=(release/*.dmg)
          shopt -u nullglob

          count=${#dmgs[@]}
          if [ "$count" -eq 0 ]; then
            echo "::error::没有打出任何 .dmg 文件 —— 打包命令虽然返回成功，但没有产物"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::打出了 $count 个 .dmg，分不清该传哪个（预期只有一个 universal 包）"
            exit 1
          fi

          # 兜底的大小检查。一个 Electron 的 universal 包不可能只有几 MB ——
          # 真出现一个几百 KB 的 .dmg，说明打包中途坏了，不该传到下载页上去。
          size=$(stat -f%z "${dmgs[0]}")
          echo "安装包大小：$size 字节"
          if [ "$size" -lt 50000000 ]; then
            echo "::error::安装包只有 $size 字节，小得不正常（universal 包应在 100 MB 以上），不传"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 代码签名自检 —— 把「到底签没签」变成日志里看得见的事实。
      #
      # 为什么需要：苹果 M 系列芯片（arm64）对「程序有没有签名」比 Intel 机器严格得多。
      # 没买证书时 electron-builder 会**完全跳过签名**（日志里那句
      # skipped macOS application code signing），这样出来的包在部分 Mac 上会直接打不开，
      # 而用户看到的提示是「已损坏，无法打开」—— 看起来像文件坏了，其实不是。
      #
      # 2026-10-04：正因为拿不准「完全没签名到底行不行」，才加了这一步实测。
      # 实测结果（见 §八 第 8 阶段）：`code object is not signed at all`、`spctl` 判 rejected。
      # 于是 electron-builder.yml 的 mac 一节加了 `identity: "-"`（临时签名）。
      # 这一步**留着**，因为它同时是那次改动的验证手段 —— 下一次跑就能看出签名有没有真的生效。
      #
      # ⚠️ 它是**诊断**，不是关卡：只把状态打到日志里，不让打包失败。
      # ⚠️ 它能证明的只有「签名状态如何」。**它证明不了「在真 Mac 上装得上、跑得起来」** ——
      #    那需要一台真的苹果电脑，本机和云端都没有。
      # ---------------------------------------------------------------------
      - name: 检查签名状态（只诊断，不拦）
        run: |
          APP=release/mac-universal/HTJizhang.app

          echo "=== 主程序里有哪几种芯片的代码 ==="
          lipo -archs "$APP/Contents/MacOS/HTJizhang" || true

          echo
          echo "=== 这个程序有没有签名 ==="
          codesign -dv --verbose=4 "$APP" 2>&1 || true

          echo
          echo "=== 签名是否完好 ==="
          if codesign --verify --deep --strict --verbose=2 "$APP" 2>&1; then
            echo "→ 签名完好"
          else
            echo "→ 签名校验没通过（没签名或不完整）"
          fi

          # -----------------------------------------------------------------
          # 把**实际写进包里的豁免**打出来。
          #
          # 为什么单独查这一项：临时签名会让 hardened runtime 触发「库校验」，
          # 它会拒绝加载 Team ID 不同的 Electron 框架 —— 结果是软件一启动就崩。
          # 修法是那几条豁免（见 electron-builder.yml 的 mac 一节）。
          #
          # 我读过 electron-builder 的源码，知道它内置模板里有这些豁免；
          # 但**「我读过源码」不是证据**，「日志里打出来了」才是。这两行就是把它变成证据。
          # 尤其要确认 disable-library-validation 在 —— 少这一条，包能打出来但跑不起来，
          # 而那种问题本机根本发现不了。
          # -----------------------------------------------------------------
          echo
          echo "=== 实际写进包里的豁免（是否含 disable-library-validation）==="
          codesign -d --entitlements :- "$APP" 2>/dev/null || echo "（取不到）"

          echo
          echo "=== Helper 子进程有没有被一起签上 ==="
          # Electron 的软件不止一个可执行文件，还有几个 Helper。
          # 只签主程序、漏掉 Helper 的话，界面能出来但功能会莫名其妙地崩。
          find "$APP/Contents/Frameworks" -maxdepth 2 -name "*.app" 2>/dev/null | while read -r helper; do
            if codesign --verify "$helper" 2>/dev/null; then
              echo "  ✓ $(basename "$helper")"
            else
              echo "  ✗ $(basename "$helper")  ← 没签上"
            fi
          done

          echo
          echo "=== 系统的安全闸门怎么判它 ==="
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

      # 顺手存一份到本次运行的「产物」里。万一下面上传 Releases 失败，
      # 这个包还能从这里下下来，不用重新打包等十分钟。
      - name: 存一份打包产物
        uses: actions/upload-artifact@v4
        with:
          name: HTJizhang-mac-dmg
          path: release/*.dmg
          retention-days: 30

      - name: 传到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          # 推标签触发 → 用标签本身当版本号；手动点 → 用你填的那个。
          # GitHub 上自带的 gh 命令，不用额外装东西。
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          echo "目标版本：$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "这个版本已经存在（比如 v1.0.0 上已经挂着 Windows 安装包），往它上面加附件"
          else
            echo "这个版本还不存在，先建一个"
            gh release create "$RELEASE_TAG" \
              --title "HT记账 $RELEASE_TAG" \
              --generate-notes
          fi

          # --clobber：同名附件直接覆盖。
          # 加上它是为了让这个流程可以**反复重跑** —— 打包失败重跑一次是很正常的操作，
          # 不加的话第二次会死在「附件已存在」上。
          gh release upload "$RELEASE_TAG" release/*.dmg --clobber

          echo
          echo "=== 上传后，这个版本下挂着哪些文件 ==="
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) 字节  \(.digest)"'
